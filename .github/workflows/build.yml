
name: Build ScanNote APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          mkdir -p /tmp/scannote
          cp Lib/Main.dart /tmp/scannote/main.dart
          flutter create --platforms=android --project-name scannote .
          cp /tmp/scannote/main.dart lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanNote-Android
          path: build/app/outputs/flutter-apk/app-release.apk
