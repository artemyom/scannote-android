
name: Build ScanNote APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preserve ScanNote source
        run: |
          test -f lib/main.dart
          mkdir -p /tmp/scannote
          cp lib/main.dart /tmp/scannote/main.dart

      - name: Create Android platform
        run: |
          flutter create --platforms=android --project-name scannote .
          cp /tmp/scannote/main.dart lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanNote-Android
          path: build/app/outputs/flutter-apk/app-release.apk

